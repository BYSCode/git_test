<!DOCTYPE html>
<html lang="en>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content=""width=device-width, initial-scale=1.0">
        <title>Methods for Adding CSS</title>
        <link rel="stylesheet" href="styles.css"> <!-- EXTERNAL STYLE-METHOD, referencing to a .css-file-->
        <style> <!-- INTERNAL STYLE-METHOD-->
            p {
                color: white;
                background-color: green;
                font-size: 18px
            }
        </style>
    </head>

    <body>
        <h1>Methods for Adding CSS - Exercise 1</h1>
        <h2>External Method -> Using a separate .css file</h2>
        <div>Style me via the external method!</div>
        <h2>Internal Method -> 'style' within head of the html-file</h2>
        <p>I would like to be styled with the internal method, please.</p>
        <h3>Inline Method -> 'style' within the body of the html-file</h3>
        <button style="background-color: orange; font-size: 18px">Inline Method</button> <!--INLINE STYLE-METHOD-->
    </body>
</html>
