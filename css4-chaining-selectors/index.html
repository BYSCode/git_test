<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaining Selectors</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Use the classes BELOW this line -->
    <div>
      <img class="avatar proportioned" src="./img/picone.jpg" 
      alt="Woman with glasses">
      <img class="avatar distorted" src="./img/pictwo.jpg" 
      alt="Man with surprised expression">

      /* Note that it created several classes here. (1) .avatar-class, 
      (2) .proportioned-class and (3) .distorted class. Whenever we have
      a space between classes it creates a new class. Thus e.g. picone belongs
      to the class .avatar as well as the class .proportioned.*/
      
    </div>
    <!-- Use the classes ABOVE this line -->
    <div>
      <img class="original proportioned" src="./img/picone.jpg" 
      alt="Woman with glasses">
      <img class="original distorted" src="./img/pictwo.jpg" 
      alt="Man with surprised expression">
    </div>
  </body>
</html>
