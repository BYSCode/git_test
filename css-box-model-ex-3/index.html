<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>box model exercise inline</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Exercise on CSS Box Model - Inline Box</h1>
        <h4>Exercise rebuilt from <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model"
            alt="MDN reference" rel="noreferral">MDN website on CSS box model</a></h4>
        <p>
         I am a paragraph. Some of the <span>words</span> have been 
         wrapped in a <span>span element</span>.
        </p>
        <ul>
            <li>Item One</li>
            <li>Item Two</li>
            <li>Item Three</li>
        </ul>
        <p class="inline">I am a paragraph. A short one.</p>
        <p class="inline">I am another paragraph. Also a short one.</p>
    </body>
</html>
